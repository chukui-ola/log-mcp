[program:log-mcp]
directory=/var/www/slp/log-mcp
command=/var/www/slp/log-mcp/log-mcp -config /var/www/slp/log-mcp/config.json -listen 127.0.0.1:18080
autostart=true
autorestart=true
startsecs=3
startretries=3
stopsignal=TERM
stopwaitsecs=10
user=jenkins
redirect_stderr=true
stdout_logfile=/var/log/supervisor/log-mcp.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=HOME="/var/lib/jenkins",USER="jenkins",PATH="/usr/local/bin:/usr/bin:/bin"
